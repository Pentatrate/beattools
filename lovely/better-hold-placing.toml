[manifest]
dump_lua = true
priority = 0
version = "1.0.0"

# Better hold placing ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''
)
self.selectedEvent = self.level.events[#self.level.events]
'''
payload = '''
if utilitools.files.beattools.eventVisuals.holds[self.selectedEvent.type] then
	self.placedHold = self.selectedEvent
end
'''
position = "after"
target = "states/Editor.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.holdEndSelected = false'''
payload = '''self.placedHold = nil'''
position = "after"
target = "states/Editor.lua"
times = 2

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.allowDragging = true'''
payload = '''
if mods.beattools.config.betterHoldPlacing and self.placedHold == self.selectedEvent then
	self.holdEndSelected = true
	self.placedHold = nil
end
'''
position = "after"
target = "states/Editor.lua"
times = 1
