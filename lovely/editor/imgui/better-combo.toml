[manifest]
dump_lua = true
priority = 0
version = "1.0.0"

# Combo adjust ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''if imgui.BeginCombo(text, var) then'''
payload = '''if imgui.BeginCombo(text, var, mods.beattools.config.betterCombo and 2^4 + 2^5 + 2^7 or nil) then'''
position = "at"
target = "lib/imguihelper.lua"
times = 1
