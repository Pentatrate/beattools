
[manifest]
dump_lua = true
priority = 2147483643 # 2147483647 - 4
version = "1.0.0"

# Generalize hold movement ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''if (self.selectedEvent.type ~= "hold") and (self.selectedEvent.type ~= "mineHold") and (self.selectedEvent.type ~= "trace") then'''
payload = '''if not utilitools.files.beattools.eventVisuals.holds[self.selectedEvent.type] then'''
position = "at"
target = "states/Editor.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''if ((v.type == "hold") or (v.type == "mineHold") or (v.type == "trace")) and v.angle2 then'''
payload = '''if utilitools.files.beattools.eventVisuals.holds[v.type] and v.angle2 and ((not mods.beattools.config.fakeRepeat) or v.beattoolsRepeatChild == nil) and not ({ ghost = true, hide = true })[utilitools.files.beattools.eventGroups.eventVisibility(v)] then'''
position = "at"
target = "states/Editor.lua"
times = 2
