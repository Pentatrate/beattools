[manifest]
dump_lua = true
priority = 2147483643 # 2147483647 - 4
version = "1.0.0"

# Hide repeatdelay ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''Event.property(event,'decimal','repeatDelay', 'Beats between repeats', {step = cs:getBeatStep(),optional = true, default = 1})'''
payload = '''
if event.repeats and event.repeats > 0 then
	Event.property(event, 'decimal', 'repeatDelay', 'Beats between repeats', {step = cs:getBeatStep(), default = 1})
else event.repeatDelay = nil end
'''
position = "at"
target = [
  "levelformat/events/Editor/tag.lua",
  "levelformat/events/level/c-me_b-me/iconsEase.lua",
  "levelformat/events/level/shinamon/offset.lua",
  "levelformat/events/level/shinamon/offsetAll.lua",
  "levelformat/events/level/shinamon/offsetEvenOdd.lua",
  "levelformat/events/Vfx/ease.lua",
  "levelformat/events/Vfx/setColor.lua",
  "levelformat/events/Vfx/setJoystickColor.lua",
  "levelformat/events/Vfx/Deco/advanceTextDeco.lua",
  "levelformat/events/Vfx/Deco/deco.lua",
  "levelformat/events/Vfx/Deco/ShaderUniform.lua",
  "levelformat/events/Vfx/Deco/textdeco.lua",
]
times = 1
