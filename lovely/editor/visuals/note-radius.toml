[manifest]
dump_lua = true
priority = 0
version = "1.0.0"

# Correct note radius ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.currentlyDragging = "none"'''
payload = '''self.noteRadius = 8'''
position = "after"
target = "states/Editor.lua"
times = 1

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.zoom = self.level.properties.speed or 40'''
payload = '''self.noteRadius = 8'''
position = "after"
target = "states/Editor.lua"
times = 3

# Custom note radius ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''self.noteRadius = 8'''
payload = '''self.noteRadius = mods.beattools.config.editorNoteRadius'''
position = "at"
target = "states/Editor.lua"
times = 6
