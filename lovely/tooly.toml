[manifest]
dump_lua = true
priority = 1
version = "1.0.0"

# Tooly plays ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''prof.push("player update")'''
payload = '''utilitools.files.beattools.tooly.play(beattools and beattools.test, cs.cBeat)'''
position = "after"
target = "obj/Player.lua"
times = 1

# Auto taps ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
target = "obj/GameManager.lua"
pattern = '''elseif savedata.options.accessibility.taps == 'auto' then'''
position = "before"
payload = '''
elseif mods.beattools.config.tooly and (cs.name == "Game" or cs.name == "Editor") then
	if cs.cBeat >= t.beat then
		hitTap = true
		t.hit = true
		self:addToScore(t.score)
		table.insert(cs.tapTiming,0)
	end
'''
match_indent = true
times = 1

# Dont save ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = '''sdfunc.save()'''
position = "at"
payload = '''
if not mods.beattools.config.tooly then
	sdfunc.save()
end
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = '''self.playedLevelsJson[saveName] = {'''
position = "before"
payload = '''
if not mods.beattools.config.tooly then
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = '''self.zoomIn = 1'''
position = "before"
payload = '''
end
'''
match_indent = true
times = 1

# No hidden level transition ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = '''self:changeToHidden()'''
position = "at"
payload = '''
if not mods.beattools.config.tooly then
	self:changeToHidden()
end
'''
match_indent = true
# times = 2
