[manifest]
dump_lua = true
priority = 1
version = "1.0.0"

# Bpm with rateMod ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.pattern]
match_indent = true
pattern = '''level.metadata.bpm = loc.get('bpm',{level.metadata.bpm})'''
payload = '''level.metadata.rawBpm = level.metadata.bpm'''
position = "before"
target = "obj/LevelManager.lua"
times = 3

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''level.metadata.bpm = minBPM .. '-' .. maxBPM'''
payload = '''
level.metadata.rawMinBpm = minBPM
level.metadata.rawMaxBpm = maxBPM
'''
position = "before"
target = "obj/LevelManager.lua"
times = 2

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''
*
love.graphics.line(xBorder,bpmY+17,project.res.x,bpmY+17)
'''
payload = '''
local str2
if str then
	str2 = str
elseif mods.beattools.config.levelSelectMultiplyBpm and self.rateMod and self.rateMod ~= 1 then
	if type(level.rawMetadata.rawBpm) == "number" then
		str2 = loc.get("bpm", { level.rawMetadata.rawBpm * self.rateMod .. "*" })
	elseif type(level.rawMetadata.rawMinBpm) == "number" then
		str2 = loc.get("bpm", { level.rawMetadata.rawMinBpm * self.rateMod .. "-" .. level.rawMetadata.rawMaxBpm * self.rateMod .. "*" })
	end
else
	str2 = level.bpm
end
love.graphics.printf(str2, xBorder + xOffset, bpmY, wrapLimit, "left")
love.graphics.line(xBorder,bpmY+17,project.res.x,bpmY+17)
'''
position = "at"
target = "states/SongSelect.lua"
times = 1
