[manifest]
dump_lua = true
priority = 0
version = "1.0.0"

# ... ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== ===== =====
[[patches]]
[patches.regex]
pattern = '''print\(\' ?'''
payload = "-- print('"
position = "at"
target = "main.lua"

[[patches]]
[patches.pattern]
match_indent = true
pattern = '''log('loaded event "'..info.name..'" ('..info.event..eType..')')'''
payload = '''-- log('loaded event "'..info.name..'" ('..info.event..eType..')')'''
position = "at"
target = "obj/GameManager.lua"
times = 1

